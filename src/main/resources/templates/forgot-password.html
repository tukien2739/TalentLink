<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Quên mật khẩu · TalentLink', ~{::#password-content})}">
<body>
<section id="password-content" class="auth-panel mx-auto p-4 p-md-5" aria-labelledby="password-title">
    <h1 class="h2 mb-4" id="password-title">Quên mật khẩu</h1>
    <p class="mb-3">Nhập email tài khoản. Mã hợp lệ trong 10 phút.</p>
    <form th:action="@{/forgot-password}" th:object="${resetRequest}" method="post" class="d-grid gap-3" novalidate>
        <div>
            <label for="email" class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('email')}" aria-describedby="email-error"
                   autocomplete="email" maxlength="254" required>
            <div id="email-error" class="invalid-feedback"
                 th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <button class="btn btn-brand mt-1" type="submit">Yêu cầu mã OTP</button>
        <p class="small mb-0"><a th:href="@{/login}">Về trang đăng nhập</a></p>
    </form>
</section>
</body>
</html>
