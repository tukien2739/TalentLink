<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Đăng nhập · TalentLink', ~{::#login-content})}">
<body>
<section id="login-content" class="auth-panel mx-auto p-4 p-md-5" aria-labelledby="login-title">
    <h1 class="h2 mb-4" id="login-title">Đăng nhập</h1>
    <form th:action="@{/login}" method="post" class="d-grid gap-3">
        <div>
            <label for="username" class="form-label">Tên đăng nhập</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div>
            <label for="password" class="form-label">Mật khẩu</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </div>
        <button class="btn btn-brand mt-1" type="submit">Đăng nhập</button>
    </form>
</section>
</body>
</html>
