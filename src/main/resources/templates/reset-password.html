<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Đặt lại mật khẩu · TalentLink', ~{::#password-content})}">
<body>
<section id="password-content" class="auth-panel mx-auto p-4 p-md-5" aria-labelledby="password-title">
    <h1 class="h2 mb-4" id="password-title">Đặt lại mật khẩu</h1>
    <form th:action="@{/reset-password}" th:object="${passwordReset}" method="post" class="d-grid gap-3" novalidate>
        <div>
            <label for="email" class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('email')}" aria-describedby="email-error"
                   autocomplete="email" maxlength="254" required>
            <div id="email-error" class="invalid-feedback"
                 th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div>
            <label for="code" class="form-label">Mã OTP</label>
            <input class="form-control" type="text" id="code" name="code" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('code')}" aria-describedby="code-error"
                   autocomplete="one-time-code" inputmode="numeric" maxlength="6" required>
            <div id="code-error" class="invalid-feedback"
                 th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
        </div>
        <div>
            <label for="newPassword" class="form-label">Mật khẩu mới</label>
            <input class="form-control" type="password" id="newPassword" name="newPassword" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('newPassword')}" aria-describedby="newPassword-help newPassword-error"
                   autocomplete="new-password" required>
            <div id="newPassword-help" class="form-text">Ít nhất 8 ký tự, tối đa 72 byte UTF-8.</div>
            <div id="newPassword-error" class="invalid-feedback"
                 th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>
        <button class="btn btn-brand mt-1" type="submit">Đặt lại mật khẩu</button>
        <p class="small mb-0"><a th:href="@{/forgot-password}">Yêu cầu mã mới</a></p>
    </form>
</section>
</body>
</html>
