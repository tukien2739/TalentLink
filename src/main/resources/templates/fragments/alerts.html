<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="feedback">
    <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert alert-info" role="status" th:if="${infoMessage}" th:text="${infoMessage}"></div>
</th:block>
</body>
</html>
