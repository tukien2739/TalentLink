<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">TalentLink</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/talentlink.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<a class="visually-hidden-focusable skip-link" href="#main-content">Đến nội dung chính</a>
<header th:replace="~{fragments/header :: siteHeader}"></header>
<main id="main-content" class="container flex-grow-1 py-4 py-md-5" tabindex="-1">
    <th:block th:replace="~{fragments/alerts :: feedback}"></th:block>
    <th:block th:replace="${content}"></th:block>
</main>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
