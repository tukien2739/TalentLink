<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Đổi mật khẩu · TalentLink', ~{::#password-content})}">
<body>
<section id="password-content" class="auth-panel mx-auto p-4 p-md-5" aria-labelledby="password-title">
    <h1 class="h2 mb-4" id="password-title">Đổi mật khẩu</h1>
    <form th:action="@{/account/password}" th:object="${passwordChange}" method="post" class="d-grid gap-3" novalidate>
        <div>
            <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
            <input class="form-control" type="password" id="currentPassword" name="currentPassword" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('currentPassword')}" aria-describedby="currentPassword-error"
                   autocomplete="current-password" required>
            <div id="currentPassword-error" class="invalid-feedback"
                 th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
        </div>
        <div>
            <label for="newPassword" class="form-label">Mật khẩu mới</label>
            <input class="form-control" type="password" id="newPassword" name="newPassword" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                   th:attr="aria-invalid=${#fields.hasErrors('newPassword')}" aria-describedby="newPassword-help newPassword-error"
                   autocomplete="new-password" required>
            <div id="newPassword-help" class="form-text">Ít nhất 8 ký tự, tối đa 72 byte UTF-8.</div>
            <div id="newPassword-error" class="invalid-feedback"
                 th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>
        <button class="btn btn-brand mt-1" type="submit">Đổi mật khẩu</button>
    </form>
</section>
</body>
</html>
