<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Kỹ năng · TalentLink', ~{::#skill-content})}">
<body>
<section id="skill-content" class="auth-panel mx-auto p-4 p-md-5" aria-labelledby="skill-title">
    <h1 class="h2 mb-4" id="skill-title" th:text="${skillId == null ? 'Thêm kỹ năng' : 'Sửa kỹ năng'}"></h1>
    <form th:action="${skillId == null} ? @{/admin/skills/new} : @{/admin/skills/{id}/edit(id=${skillId})}"
          th:object="${skillForm}" method="post" class="d-grid gap-3" novalidate>
        <div>
            <label for="name" class="form-label">Tên kỹ năng</label>
            <input class="form-control" type="text" th:field="*{name}" th:errorclass="is-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('name')}" aria-describedby="name-error"
                   maxlength="100" required>
            <div id="name-error" class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div>
            <label for="category" class="form-label">Nhóm kỹ năng</label>
            <select class="form-select" th:field="*{category}" th:errorclass="is-invalid"
                    th:attr="aria-invalid=${#fields.hasErrors('category')}" aria-describedby="category-error" required>
                <option value="">Chọn nhóm kỹ năng</option>
                <option th:each="option : ${categories}" th:value="${option}" th:text="${option.label}"></option>
            </select>
            <div id="category-error" class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-brand" th:href="@{/admin/skills}">Hủy</a>
            <button class="btn btn-brand" type="submit">Lưu kỹ năng</button>
        </div>
    </form>
</section>
</body>
</html>
